name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: backend
          version: latest

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  e2e-api:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: tests/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Install API test dependencies
        run: npm ci
        working-directory: tests/api

      - name: Start backend
        run: |
          cd backend
          go build -o server ./cmd/server
          ./server &
          sleep 5
        working-directory: .

      - name: Run API tests
        run: npx vitest run

  e2e-web:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: tests/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install web test dependencies
        run: npm ci
        working-directory: tests/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests/web

      - name: Start backend
        run: |
          cd backend
          go build -o server ./cmd/server
          ./server &
          sleep 5
        working-directory: .

      - name: Start frontend
        run: |
          cd frontend
          npm run dev &
          sleep 10
        working-directory: .

      - name: Run Web E2E tests
        run: npx playwright test

  e2e-infra:
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: tests/infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install infra test dependencies
        run: npm ci
        working-directory: tests/infra

      - name: Run Infra tests
        run: npx vitest run
